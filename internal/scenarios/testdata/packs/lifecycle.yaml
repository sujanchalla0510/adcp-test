# Full media-buy lifecycle: create -> activate -> pause -> resume ->
# cancel, then verify the seller rejects the illegal cancelled -> active
# transition with a structured error. Synthetic fixture; run against the
# example mock seller (examples/mock-seller.yaml) or a real seller.
name: lifecycle
description: Walk a media buy through its full legal lifecycle; illegal transitions must fail with error -32001.
scenarios:
  - name: full lifecycle
    description: Drive the media-buy lifecycle state machine through every legal move and one illegal move.
    steps:
      - name: create media buy
        tool: create_media_buy
        arguments:
          buyer_ref: adcp-test-lifecycle-pack
          product_id: prod-web-banner
          account: adcp-test
          brand: adcp-test
          start_time: "2026-10-01T00:00:00Z"
          end_time: "2026-10-08T00:00:00Z"
          budget_micros: 1000000
        save:
          media_buy_id: media_buy_id
        assertions:
          - status: ok
          - response_contains:
              status: draft
      - name: activate buy
        tool: update_media_buy
        arguments:
          media_buy_id: "{{vars.media_buy_id}}"
          status: active
        assertions:
          - status: ok
          - response_contains:
              status: active
      - name: pause buy
        tool: update_media_buy
        arguments:
          media_buy_id: "{{vars.media_buy_id}}"
          status: paused
        assertions:
          - status: ok
          - response_contains:
              status: paused
      - name: resume buy
        tool: update_media_buy
        arguments:
          media_buy_id: "{{vars.media_buy_id}}"
          status: active
        assertions:
          - status: ok
          - response_contains:
              status: active
      - name: cancel buy
        tool: update_media_buy
        arguments:
          media_buy_id: "{{vars.media_buy_id}}"
          status: cancelled
        assertions:
          - status: ok
          - response_contains:
              status: cancelled
      - name: illegal re-activation fails
        tool: update_media_buy
        arguments:
          media_buy_id: "{{vars.media_buy_id}}"
          status: active
        assertions:
          - status: error
          - error_code: -32001
