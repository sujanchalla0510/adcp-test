# Happy-path media buy: the core AdCP seller flow end to end.
# Synthetic fixture: product ids, budgets, and creative attributes are
# invented. Designed against the adcp-test mock seller's demo routes
# (get_products / create_media_buy / sync_creatives / get_media_buy_delivery)
# but written generically enough to run against any AdCP-ish seller.
name: happy-path-media-buy
description: Full media buy lifecycle — discover products, create a buy, sync a creative, read delivery.
scenarios:
  - name: display media buy
    description: Create a display media buy and verify delivery reporting.
    steps:
      - name: list products
        tool: get_products
        arguments: {}
        assertions:
          - status: ok
          - latency_ms_lt: 2000
          - response_contains:
              products:
                - product_id: prod-web-banner
      - name: create media buy
        tool: create_media_buy
        arguments:
          product_id: prod-web-banner
          budget_micros: 5000000
        save:
          media_buy_id: media_buy_id
        assertions:
          - status: ok
          - response_contains:
              status: draft
      - name: sync creative
        tool: sync_creatives
        arguments:
          media_buy_id: "{{vars.media_buy_id}}"
          creative:
            format: display
            width: 300
            height: 250
        assertions:
          - status: ok
          - response_contains:
              status: approved
      - name: read delivery
        tool: get_media_buy_delivery
        arguments:
          media_buy_id: "{{vars.media_buy_id}}"
        assertions:
          - status: ok
          - response_contains:
              media_buy_id: "{{vars.media_buy_id}}"
    teardown:
      - tool: update_media_buy
        arguments:
          media_buy_id: "{{vars.media_buy_id}}"
          status: cancelled
